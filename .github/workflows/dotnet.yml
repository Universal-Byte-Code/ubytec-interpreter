name: .NET
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore -p:EnableDocFxOnBuild=false -p:EnableNETAnalyzers=true -p:RunAnalyzers=true -p:ErrorLog=analyzers.sarif
    - name: Upload SARIF Analysis Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: analyzers-sarif-${{ matrix.os }}
        path: '**/analyzers.sarif'
    - name: Install NASM on Linux
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y nasm gcc clang time
    - name: Install NASM on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP 'nasm.zip'
        $destination = Join-Path $env:RUNNER_TEMP 'ubytec-nasm'
        Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip' -OutFile $archive
        Expand-Archive -LiteralPath $archive -DestinationPath $destination
        $assembler = Join-Path $destination 'nasm-2.16.03/nasm.exe'
        "UBYTEC_NASM=$assembler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Test native core and complete source programs
      run: dotnet test Ubytec.Tests/Ubytec.Tests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory artifacts/tests
    - name: Native bounded string corpus and unsigned integer reference
      if: runner.os == 'Linux'
      run: python3 corpus/libft/run_strings.py --output artifacts/libft-strings
    - name: Generic vector model and protected loan lifecycle
      if: runner.os == 'Linux'
      run: python3 corpus/libft/run_vector.py --output artifacts/vector
    - name: Indirect callbacks and independent linked-list model
      if: runner.os == 'Linux'
      run: python3 corpus/libft/run_lists.py --output artifacts/lists
    - name: Complete streaming text application and authorized file I/O
      if: runner.os == 'Linux'
      run: python3 corpus/libft/run_text.py --output artifacts/text
    - name: Text diagnostics and equivalent scalar kernels (no speed threshold)
      if: runner.os == 'Linux'
      run: python3 corpus/libft/run_text_diagnostics.py --output artifacts/text-diagnostics
    - name: Stack transfers paired correctness and protected regression
      if: runner.os == 'Linux'
      run: |
        python3 corpus/libft/run_stack_transfers.py --output artifacts/stack-transfers
        python3 corpus/libft/run_text.py --stack-transfers --output artifacts/text-stack-transfers
    - name: Frame values paired correctness and protected regression
      if: runner.os == 'Linux'
      run: |
        python3 corpus/libft/run_stack_transfers.py --frame-values --output artifacts/frame-values
        python3 corpus/libft/run_text.py --stack-transfers --frame-values --output artifacts/text-frame-values
    - name: Frame registers interleaved correctness and protected regression
      if: runner.os == 'Linux'
      run: |
        python3 corpus/libft/run_frame_registers.py --output artifacts/frame-registers
        python3 corpus/libft/run_text.py --stack-transfers --frame-registers --output artifacts/text-frame-registers
    - name: Scalar loop reductions, fault ledger and protected regression
      if: runner.os == 'Linux'
      run: |
        python3 corpus/libft/run_loop_reductions.py --output artifacts/loop-reductions
        python3 corpus/libft/run_text.py --stack-transfers --frame-registers --loop-reductions --output artifacts/text-loop-reductions
    - name: Page bounded SSE2 reductions, faults and protected loans
      if: runner.os == 'Linux'
      run: |
        python3 corpus/libft/run_block_reductions.py --output artifacts/block-reductions/paired
        python3 corpus/libft/run_block_reduction_loans.py --output artifacts/block-reductions/protected
        python3 corpus/libft/run_text.py --stack-transfers --frame-registers --block-reductions --output artifacts/text-block-reductions
    - name: Native AVX2 selection, forced SSE2 fallback and protected regression
      if: runner.os == 'Linux'
      run: |
        DOTNET_EnableAVX2=0 dotnet test Ubytec.Tests/Ubytec.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~BlockReductionTests|FullyQualifiedName~LoopReductionTests" --logger "trx;LogFileName=forced-sse2.trx" --results-directory artifacts/avx2-reductions/tests
        python3 corpus/libft/run_block_reduction_loans.py --native-block-reductions --output artifacts/avx2-reductions/protected
        python3 corpus/libft/run_text.py --stack-transfers --frame-registers --block-reductions-native --output artifacts/text-avx2-reductions
        python3 corpus/libft/run_avx2_reductions.py --output artifacts/avx2-reductions/paired
    - name: Constant stride record reductions, exact faults and protected regression
      if: runner.os == 'Linux'
      run: |
        python3 corpus/libft/run_record_reduction_loans.py --output artifacts/record-reductions/protected
        python3 corpus/libft/run_text.py --stack-transfers --frame-registers --record-reductions --output artifacts/text-record-reductions
        python3 corpus/libft/run_record_reductions.py --output artifacts/record-reductions/paired
    - name: Nested lookup reductions, exact read ledgers and two loan regression
      if: runner.os == 'Linux'
      run: |
        python3 corpus/libft/run_lookup_reduction_loans.py --output artifacts/lookup-reductions/protected
        python3 corpus/libft/run_text.py --stack-transfers --frame-registers --lookup-reductions --output artifacts/text-lookup-reductions
        python3 corpus/libft/run_lookup_reductions.py --output artifacts/lookup-reductions/paired
    - name: Effect register barriers and real text regression
      if: runner.os == 'Linux'
      run: |
        python3 corpus/libft/run_text.py --stack-transfers --frame-registers --effect-registers --output artifacts/text-effect-registers
        python3 corpus/libft/run_effect_registers.py --output artifacts/effect-registers/paired
    - name: Text benchmark functional smoke (no speed threshold)
      if: runner.os == 'Linux'
      run: python3 corpus/libft/run_text_benchmark.py --warmup 0 --samples 1 --case empty --case 4096-v64-uniform-b4096 --output artifacts/text-benchmark
    - name: Build and smoke-test standalone C reference
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p artifacts
        cc -std=c11 -Wall -Wextra -Werror corpus/libft/reference.c -o artifacts/libft-reference
        test "$(artifacts/libft-reference isalpha 65)" -eq 1
        test "$(artifacts/libft-reference toupper 97)" -eq 65
        test "$(artifacts/libft-reference atoi '  -42suffix')" -eq -42
        test "$(artifacts/libft-reference atoi '-2147483648')" -eq -2147483648
    - name: Compile and execute complete Linux examples
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p artifacts
        for example in answer control-flow; do
          dotnet Ubytec/bin/Release/net9.0/Ubytec.dll "examples/$example.ubc" -o "artifacts/$example.nasm"
          nasm -f elf64 "artifacts/$example.nasm" -o "artifacts/$example.o"
          ld -o "artifacts/$example" "artifacts/$example.o"
          ubytec_status=0
          "./artifacts/$example" || ubytec_status=$?
          test "$ubytec_status" -eq 42
        done
    - name: Preserve corpus evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: corpus-evidence-${{ matrix.os }}
        path: |
          artifacts/tests/*.trx
          artifacts/effect-registers/**/*.trx
          artifacts/effect-registers/**/*.json
          artifacts/effect-registers/**/*.jsonl
          artifacts/effect-registers/**/*.nasm
          artifacts/effect-registers/**/*.ubc
          artifacts/effect-registers/**/*.txt
          artifacts/effect-registers/paired/text-paired-client.c
          artifacts/effect-registers/paired/verify-client.c
          artifacts/text-effect-registers/text-report.json
          artifacts/text-effect-registers/text-provenance.json
          artifacts/text-effect-registers/protected-*.jsonl
          artifacts/text-effect-registers/*.nasm
          artifacts/text-effect-registers/*.ubc
          artifacts/text-effect-registers/typed-regression/typed-report.json
          artifacts/lookup-reductions/**/*.trx
          artifacts/lookup-reductions/**/*.json
          artifacts/lookup-reductions/**/*.jsonl
          artifacts/lookup-reductions/**/*.nasm
          artifacts/lookup-reductions/**/*.ubc
