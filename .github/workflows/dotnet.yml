          artifacts/text-lookup-reductions/protected-*.jsonl
          artifacts/text-lookup-reductions/*.nasm
          artifacts/text-lookup-reductions/*.ubc
          artifacts/text-lookup-reductions/typed-regression/typed-report.json
          artifacts/record-reductions/**/*.trx
          artifacts/record-reductions/**/*.json
          artifacts/record-reductions/**/*.jsonl
          artifacts/record-reductions/**/*.nasm
