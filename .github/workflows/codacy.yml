# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '44 12 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d43360362776a6789b47b99ae8973510854e2d3d
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
          skip-uncommitted-files-check: true

      # Codacy CLI 7.10 honors the repository's .codacy.yml scope. Preserve the
      # historical SonarC# tool identifier expected by the existing repository
      # ruleset; newer CLI versions spell the identifier differently.
      - name: Preserve SonarC# ruleset identifier
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_path = Path("results.sarif")
          output_path = Path("github-results.sarif")
          sarif = json.loads(source_path.read_text(encoding="utf-8"))

          sonar_runs = 0
          for run in sarif.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              name = driver.get("name", "")
              folded = name.casefold()
              if "sonar" not in folded or not ("csharp" in folded or "c#" in folded):
                  continue

              print(f"Normalizing SonarC# SARIF tool identifier: {name!r} -> 'Sonarscharp (reported by Codacy)'")
              driver["name"] = "Sonarscharp (reported by Codacy)"
              sonar_runs += 1

          if sonar_runs == 0:
              raise SystemExit("No SonarC# SARIF run found; refusing to upload an unverified result set.")

          output_path.write_text(json.dumps(sarif, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: github-results.sarif

