name: Temporal reference models
on:
  push:
    paths:
      - 'prototypes/temporal/**'
      - '.github/workflows/temporal-reference.yml'
  pull_request:
    paths:
      - 'prototypes/temporal/**'
      - '.github/workflows/temporal-reference.yml'

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python prototypes/temporal/reference.py
      - run: python prototypes/temporal/frontier.py
